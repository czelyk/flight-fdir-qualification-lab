name: Monitor qualification tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: C implementation versus reference and wrap checks
        run: python tools/run_tests.py
      - name: Compare one-shot and periodic monitor ticks
        run: python tools/run_tickless.py
      - name: Check first-sample deadlines and producer restarts
        run: python tools/run_acquisition.py
      - name: Reproduce the restart policy comparison
        run: python tools/run_restart_policy.py --check
      - name: Verify checked-in evidence
        run: python tools/verify.py
      - name: Replay the missing-data witness
        run: python tools/replay.py --scenario one_sample_then_silence --policy observed
      - name: Conventional CMake build on Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
